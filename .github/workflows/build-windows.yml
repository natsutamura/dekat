name: build-windows

# Tauri tidak bisa di-cross-compile dengan andal dari Linux ke Windows (butuh MSVC +
# WebView2 SDK), jadi installer dibangun di runner Windows asli.
on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # CLI Tauri lewat npm: jauh lebih cepat daripada `cargo install tauri-cli`.
      - name: Setup Node + Tauri CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tauri-cli
        run: npm install -g @tauri-apps/cli@^2

      # --bundles msi,nsis: menghasilkan installer, bukan cuma .exe telanjang.
      # Installer ini penting bukan cuma buat rapi: tanpa instalasi, Windows tidak
      # punya AppUserModelID untuk aplikasi ini, dan notifikasi toast tidak muncul.
      - name: Build installer
        working-directory: apps/desktop
        run: tauri build --bundles "msi,nsis" --verbose

      - name: Kumpulkan artefak
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem -Recurse -Filter *.msi target | Select-Object -First 1
          $nsis = Get-ChildItem -Recurse -Filter *-setup.exe target | Select-Object -First 1
          if (-not $msi) { throw "MSI tidak dihasilkan" }
          Copy-Item $msi.FullName "dist/Dekat-$($msi.Name -replace '.*_','')"
          if ($nsis) { Copy-Item $nsis.FullName "dist/Dekat-setup.exe" }
          Copy-Item README.md dist/README.md
          Get-ChildItem dist | Select-Object Name, Length
          $mb = [math]::Round($msi.Length / 1MB, 2)
          "UKURAN_MSI=$mb MB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dekat-windows-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Ringkasan
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Dekat untuk Windows"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- Installer MSI: $env:UKURAN_MSI"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Artefak: ``Dekat-windows-installer``"
